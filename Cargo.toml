[package]
name = "ddu"
version = "0.1.0"
edition = "2024"

[dependencies]
rfd = "0.15"
alacritty_terminal = "0.24"
anyhow = "1.0.104"
async-channel = "2"
git2 = "0.19"
gpui-kit = "0.6"
parking_lot = "0.12"
portable-pty = "0.9"
rustix = { version = "0.38", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shlex = "1.3"

[dev-dependencies]
# Enables gpui's TestAppContext/run_test_once for headless app tests
# (terminal IME regression); feature-unifies only into test builds.
gpui-kit = { version = "0.6", features = ["test-support"] }
