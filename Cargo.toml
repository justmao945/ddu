[package]
name = "ddu"
version = "0.1.0"
edition = "2024"

[dependencies]
rfd = "0.15"
alacritty_terminal = "0.24"
anyhow = "1.0.104"
async-channel = "2"
git2 = "0.19"
# Grammars for the pane's syntax highlighting (`tree-sitter-*` features are
# forwarded through gpui-kit). One feature per language keeps the build to
# the grammars the pane can actually meet: c/c++, java, html, css,
# javascript (+ jsx), typescript/tsx, rust, go, python, swift, bash (+ sh).
# JSON rides along with the base `tree-sitter` feature. There is no QML
# grammar in the ecosystem gpui-component wraps.
gpui-kit = { version = "0.6", features = [
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-css",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-swift",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
] }
parking_lot = "0.12"
portable-pty = "0.9"
rustix = { version = "0.38", features = ["std", "event"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shlex = "1.3"

[dev-dependencies]
# Enables gpui's TestAppContext/run_test_once for headless app tests
# (terminal IME regression); feature-unifies only into test builds.
gpui-kit = { version = "0.6", features = ["test-support"] }

# The gpui stack is pinned to the commit that fixes the rendered document's
# double wrap, which 0.6.1 (the newest release) still carries: `InlineFlow`
# measured each fragment and then gave its nested text element exactly that
# measured width, so a lost f32 bit left it narrower than its own text, the
# element wrapped its last break opportunity onto a second line, and the tail
# landed on the line below while the flow's line count stayed one short
# (`docs/UI.md`, "The rendered document's text"). `bfd72443` — "text: prevent
# inline-code fragments from wrapping twice" (#3046), merged 2026-09-11 — adds
# `whitespace_nowrap()` to that fragment container; the whole family rides the
# one rev, so the git checkout stays internally consistent. Drop this section
# (and `cargo update -p gpui-kit`) once a release past 0.6.1 lands.
[patch.crates-io]
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "bfd7244371ff58db1b01b54cc8858b64ee106108" }
