# ddu — a Cargo workspace. Every source file lives in a crate under
# `crates/`; the layers are, bottom up:
#
#   ddu-terminal   PTY + alacritty grid + the custom paint element
#   ddu-diff       git2 working-tree diff model, listing and the file view
#   ddu-core       domain model (projects/sessions) + settings/state persistence
#   ddu-app        the shell: AppView and every panel (app/ + ui/)
#   ddu            the binary: window creation, assets, the panic log
#
# Each layer only depends on the ones below it (docs/DESIGN.md §3).
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
alacritty_terminal = "0.26"
anyhow = "1.0.104"
async-channel = "2"
git2 = "0.21"
gpui-kit = "0.6"
parking_lot = "0.12"
portable-pty = "0.9"
rfd = "0.17"
rustix = { version = "1.1", features = ["std", "event"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shlex = "2.0"

ddu-app = { path = "crates/ddu-app" }
ddu-core = { path = "crates/ddu-core" }
ddu-diff = { path = "crates/ddu-diff" }
ddu-terminal = { path = "crates/ddu-terminal" }

# No `[patch.crates-io]` for gpui-kit: the git pin existed for the rendered
# document's double wrap (`InlineFlow` measured each fragment, then gave its
# nested text element exactly that width, so a lost f32 bit left it narrower
# than its own text and the tail wrapped onto the next line while the flow's
# line count stayed one short — `docs/UI.md`, "The rendered document's text"),
# and the fix — `whitespace_nowrap()` on that fragment container — shipped in
# the 0.6.2 release (checked in `gpui-base-0.6.2/src/text/inline_flow.rs`).
